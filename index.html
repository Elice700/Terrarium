
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Terrarium</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: rgb(235,235,235);
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

#canvas-container {
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>
<div id="canvas-container"></div>

<script>

// ==================================================
// GLOBAL VARIABLES
// ==================================================

let moldParticles = [];
let growthFrontier = [];
let spatialGrid = {};

let cellSize = 8;

let pinkFood = [];
let heartParticles = [];

let lizard;

// Targets abandoned after timeout
let abandonedTargets = new WeakSet();

const MAX_MOLD = 6000;

const GROWTH_STEP_MIN = 4.5;
const GROWTH_STEP_MAX = 7.0;
const GROWTH_ANGLE = 65;
const GROWTH_ATTEMPTS_PER_FRAME = 4;
const MAX_CHILDREN = 3;


// ==================================================
// INITIALIZATION
// ==================================================

function setup() {

    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvas-container');

    angleMode(DEGREES);

    lizard = new Lizard(width / 2, height / 2);

    initScreenEdgeMold();
}


// ==================================================
// SPATIAL GRID
// ==================================================

function getKey(x, y) {
    return floor(x / cellSize) + "," + floor(y / cellSize);
}


function addSpatial(p) {

    let key = getKey(p.x, p.y);

    if (!spatialGrid[key]) {
        spatialGrid[key] = [];
    }

    spatialGrid[key].push(p);
}


function removeSpatial(p) {

    let key = getKey(p.x, p.y);
    let cell = spatialGrid[key];

    if (cell) {

        let idx = cell.indexOf(p);

        if (idx !== -1) {
            cell.splice(idx, 1);
        }

        if (cell.length === 0) {
            delete spatialGrid[key];
        }
    }

    p.active = false;
}


function checkOverlap(x, y, minDist = 4) {

    let cx = floor(x / cellSize);
    let cy = floor(y / cellSize);

    let range = ceil(minDist / cellSize) + 1;

    for (let dx = -range; dx <= range; dx++) {

        for (let dy = -range; dy <= range; dy++) {

            let key = (cx + dx) + "," + (cy + dy);
            let cell = spatialGrid[key];

            if (!cell) continue;

            for (let p of cell) {

                if (
                    p.active &&
                    dist(x, y, p.x, p.y) < minDist
                ) {
                    return true;
                }
            }
        }
    }

    return false;
}


// ==================================================
// MOLD PARTICLES
// ==================================================

class MoldParticle {

    constructor(x, y) {

        this.x = x;
        this.y = y;

        this.active = true;

        this.children = 0;

        this.size = random(2.5, 4.0);
        this.alpha = random(190, 240);

        this.growthCooldown = floor(random(0, 30));
    }


    canGrow() {

        return this.active &&
               this.children < MAX_CHILDREN;
    }

}


// ==================================================
// INITIAL EDGE COVERAGE
// ==================================================

function initScreenEdgeMold() {

    moldParticles = [];
    growthFrontier = [];
    spatialGrid = {};

    let spacing = 6;

    // Top and bottom edges
    for (let x = 3; x < width; x += spacing) {

        addMold(new MoldParticle(x, 3));
        addMold(new MoldParticle(x, height - 3));
    }

    // Left and right edges
    for (let y = 3; y < height; y += spacing) {

        addMold(new MoldParticle(3, y));
        addMold(new MoldParticle(width - 3, y));
    }
}


function addMold(p) {

    moldParticles.push(p);
    growthFrontier.push(p);

    addSpatial(p);
}


// ==================================================
// ORGANIC INWARD MOLD GROWTH
// ==================================================

function growMold() {

    if (moldParticles.length >= MAX_MOLD) return;

    let centerX = width / 2;
    let centerY = height / 2;

    for (
        let attempt = 0;
        attempt < GROWTH_ATTEMPTS_PER_FRAME;
        attempt++
    ) {

        if (moldParticles.length >= MAX_MOLD) break;

        if (growthFrontier.length === 0) break;

        let index = floor(random(growthFrontier.length));
        let parent = growthFrontier[index];

        if (!parent.active || !parent.canGrow()) {

            growthFrontier.splice(index, 1);
            attempt--;
            continue;
        }

        parent.growthCooldown--;

        if (parent.growthCooldown > 0) continue;

        let oldDistance = dist(
            parent.x,
            parent.y,
            centerX,
            centerY
        );

        // General inward direction
        let inwardAngle = atan2(
            centerY - parent.y,
            centerX - parent.x
        );

        let successful = false;

        // Randomized growth attempts
        for (let trial = 0; trial < 8; trial++) {

            let angle = inwardAngle +
                random(-GROWTH_ANGLE, GROWTH_ANGLE);

            let step = random(
                GROWTH_STEP_MIN,
                GROWTH_STEP_MAX
            );

            let nx = parent.x + cos(angle) * step;
            let ny = parent.y + sin(angle) * step;

            // Screen boundaries
            if (
                nx < 5 || nx > width - 5 ||
                ny < 5 || ny > height - 5
            ) {
                continue;
            }

            let newDistance = dist(
                nx, ny,
                centerX, centerY
            );

            // Every offspring must be closer to center
            if (newDistance >= oldDistance - 0.5) {
                continue;
            }

            if (checkOverlap(nx, ny, 4.0)) {
                continue;
            }

            let child = new MoldParticle(nx, ny);

            addMold(child);

            parent.children++;

            parent.growthCooldown = floor(random(5, 25));

            successful = true;

            break;
        }

        // Retire blocked growth tips
        if (!successful) {

            parent.children++;

            if (parent.children >= MAX_CHILDREN) {
                growthFrontier.splice(index, 1);
            }
        }

        if (parent.children >= MAX_CHILDREN) {

            let idx = growthFrontier.indexOf(parent);

            if (idx !== -1) {
                growthFrontier.splice(idx, 1);
            }
        }
    }
}


// ==================================================
// DISPLAY MOLD
// ==================================================

function displayMold() {

    noStroke();

    for (let p of moldParticles) {

        if (!p.active) continue;

        fill(100, 190, 80, p.alpha);

        circle(p.x, p.y, p.size);
    }
}


// ==================================================
// MAIN DRAW LOOP
// ==================================================

function draw() {

    background(235, 235, 235);

    growMold();

    displayMold();

    // Pink food
    for (let i = pinkFood.length - 1; i >= 0; i--) {

        let f = pinkFood[i];

        fill(255, 105, 180);
        stroke(255, 192, 203);
        strokeWeight(1.5);

        circle(
            f.x,
            f.y,
            10 + sin(frameCount * 10 + i) * 2
        );
    }

    // Lizard
    lizard.update();
    lizard.display();

    // Hearts
    for (let i = heartParticles.length - 1; i >= 0; i--) {

        let hp = heartParticles[i];

        hp.update();
        hp.display();

        if (hp.isDead()) {
            heartParticles.splice(i, 1);
        }
    }
}


// ==================================================
// LIZARD
// ==================================================

class Lizard {

    constructor(x, y) {

        this.numSegments = 16;
        this.segmentLen = 10;

        this.history = [];

        // Movement physics
        this.velocity = createVector(1, 0);

        this.maxSpeed = 2.5;
        this.maxForce = 0.065;

        this.headAngle = 0;

        // Targeting
        this.currentTarget = null;
        this.targetStartTime = 0;

        // Smooth wandering
        this.wanderAngle = random(360);
        this.wanderTimer = 0;

        for (let i = 0; i < this.numSegments; i++) {

            this.history.push(
                createVector(
                    x - i * this.segmentLen,
                    y
                )
            );
        }
    }


    // ==================================================
    // TARGET SELECTION
    // ==================================================

    selectTarget() {

        let centerX = width / 2;
        let centerY = height / 2;

        let bestTarget = null;
        let bestDistance = Infinity;
        let targetType = null;

        // Search all green mold particles
        for (let p of moldParticles) {

            if (!p.active) continue;

            if (abandonedTargets.has(p)) continue;

            let d = dist(
                p.x, p.y,
                centerX, centerY
            );

            if (d < bestDistance) {

                bestDistance = d;
                bestTarget = p;
                targetType = 'mold';
            }
        }

        // Search pink food
        for (let f of pinkFood) {

            if (abandonedTargets.has(f)) continue;

            let d = dist(
                f.x, f.y,
                centerX, centerY
            );

            if (d < bestDistance) {

                bestDistance = d;
                bestTarget = f;
                targetType = 'pink';
            }
        }

        if (bestTarget) {

            this.currentTarget = {
                type: targetType,
                ref: bestTarget
            };

            this.targetStartTime = millis();

            return true;
        }

        return false;
    }


    // ==================================================
    // VALIDATE CURRENT TARGET
    // ==================================================

    validateTarget() {

        if (!this.currentTarget) return false;

        let ref = this.currentTarget.ref;

        let valid = false;

        if (this.currentTarget.type === 'pink') {

            valid = pinkFood.includes(ref);
        }

        else if (this.currentTarget.type === 'mold') {

            valid =
                ref.active &&
                moldParticles.includes(ref);
        }

        // Target timeout
        if (millis() - this.targetStartTime >= 5000) {

            abandonedTargets.add(ref);

            valid = false;
        }

        if (!valid) {

            this.currentTarget = null;

            return false;
        }

        return true;
    }


    // ==================================================
    // SMOOTH STEERING
    // ==================================================

    steerTowards(target) {

        let head = this.history[0];

        let desired = p5.Vector.sub(target, head);

        let distance = desired.mag();

        if (distance < 0.001) return;

        desired.normalize();

        // Gradually slow down when approaching destination
        let speed = this.maxSpeed;

        let arrivalRadius = 65;

        if (distance < arrivalRadius) {

            speed = map(
                distance,
                0,
                arrivalRadius,
                0.9,
                this.maxSpeed
            );

            speed = constrain(speed, 0.9, this.maxSpeed);
        }

        desired.mult(speed);

        // Steering force
        let steering = p5.Vector.sub(
            desired,
            this.velocity
        );

        steering.limit(this.maxForce);

        // Apply acceleration
        this.velocity.add(steering);

        this.velocity.limit(this.maxSpeed);
    }


    // ==================================================
    // NATURAL WANDERING
    // ==================================================

    wander() {

        this.wanderTimer--;

        if (this.wanderTimer <= 0) {

            this.wanderAngle += random(-45, 45);

            this.wanderTimer = floor(random(25, 65));
        }

        let head = this.history[0];

        let wanderDistance = 100;

        let target = createVector(
            head.x + cos(this.wanderAngle) * wanderDistance,
            head.y + sin(this.wanderAngle) * wanderDistance
        );

        // Gently guide away from boundaries
        let margin = 90;

        if (
            head.x < margin ||
            head.x > width - margin ||
            head.y < margin ||
            head.y > height - margin
        ) {

            target = createVector(
                width / 2,
                height / 2
            );
        }

        this.steerTowards(target);
    }


    // ==================================================
    // BODY FOLLOWING
    // ==================================================

    updateBody() {

        for (let i = 1; i < this.history.length; i++) {

            let prev = this.history[i - 1];
            let curr = this.history[i];

            let dir = p5.Vector.sub(prev, curr);

            if (dir.magSq() < 0.001) {
                dir.set(1, 0);
            }

            dir.setMag(this.segmentLen);

            let desiredPosition = p5.Vector.sub(prev, dir);

            // Slight smoothing for natural body movement
            curr.lerp(desiredPosition, 0.85);
        }
    }


    // ==================================================
    // EATING
    // ==================================================

    eatFood(nextHead) {

        // Pink food
        for (let i = pinkFood.length - 1; i >= 0; i--) {

            let f = pinkFood[i];

            if (
                dist(nextHead.x, nextHead.y, f.x, f.y) < 20
            ) {

                pinkFood.splice(i, 1);

                if (
                    this.currentTarget &&
                    this.currentTarget.ref === f
                ) {
                    this.currentTarget = null;
                }

                spawnHearts(
                    nextHead.x,
                    nextHead.y,
                    4
                );
            }
        }

        // Green mold
        for (let i = moldParticles.length - 1; i >= 0; i--) {

            let p = moldParticles[i];

            if (
                p.active &&
                dist(nextHead.x, nextHead.y, p.x, p.y) < 16
            ) {

                removeSpatial(p);

                moldParticles.splice(i, 1);

                let idx = growthFrontier.indexOf(p);

                if (idx !== -1) {
                    growthFrontier.splice(idx, 1);
                }

                if (
                    this.currentTarget &&
                    this.currentTarget.ref === p
                ) {
                    this.currentTarget = null;
                }
            }
        }
    }


    // ==================================================
    // MAIN UPDATE
    // ==================================================

    update() {

        let head = this.history[0];

        // Validate target or abandon after five seconds
        this.validateTarget();

        // Select a new target if necessary
        if (!this.currentTarget) {
            this.selectTarget();
        }

        // Move towards selected food
        if (this.currentTarget) {

            let target = createVector(
                this.currentTarget.ref.x,
                this.currentTarget.ref.y
            );

            this.steerTowards(target);

        } else {

            this.wander();
        }


        // Boundary avoidance
        let margin = 25;

        if (
            head.x < margin ||
            head.x > width - margin ||
            head.y < margin ||
            head.y > height - margin
        ) {

            let center = createVector(
                width / 2,
                height / 2
            );

            this.steerTowards(center);
        }


        // Move head using velocity
        let nextHead = p5.Vector.add(
            head,
            this.velocity
        );

        // Keep inside window
        nextHead.x = constrain(
            nextHead.x,
            margin,
            width - margin
        );

        nextHead.y = constrain(
            nextHead.y,
            margin,
            height - margin
        );

        this.history[0] = nextHead;

        // Smooth body following
        this.updateBody();

        // Update head orientation
        if (this.velocity.magSq() > 0.01) {

            this.headAngle = this.velocity.heading();
        }

        // Eat nearby food
        this.eatFood(nextHead);
    }


    // ==================================================
    // DISPLAY
    // ==================================================

    display() {

        // Legs
        noFill();

        this.drawLegPair(4, 20, 40);
        this.drawLegPair(11, 16, 50);

        // Body segments
        for (let i = this.history.length - 1; i >= 0; i--) {

            let pos = this.history[i];

            let size = map(
                i,
                0,
                this.history.length - 1,
                22,
                14
            );

            fill(240, 130, 40);

            stroke(180, 80, 20);
            strokeWeight(2);

            circle(
                pos.x,
                pos.y,
                size
            );
        }

        // Head
        let head = this.history[0];

        push();

        translate(head.x, head.y);
        rotate(this.headAngle);

        fill(250, 140, 50);

        stroke(180, 80, 20);
        strokeWeight(2);

        ellipse(2, 0, 28, 22);

        // Eyes
        fill(255);
        noStroke();

        ellipse(6, -6, 7, 7);
        ellipse(6, 6, 7, 7);

        fill(30);

        ellipse(7, -6, 3, 4);
        ellipse(7, 6, 3, 4);

        pop();
    }


    // ==================================================
    // LEGS
    // ==================================================

    drawLegPair(segmentIdx, legLen, restAngle) {

        if (segmentIdx >= this.history.length) return;

        let pos = this.history[segmentIdx];
        let prev = this.history[segmentIdx - 1];

        let angle = atan2(
            pos.y - prev.y,
            pos.x - prev.x
        );

        stroke(200, 100, 30);
        strokeWeight(4);
        strokeCap(ROUND);

        let wiggle = sin(
            frameCount * 12 + segmentIdx * 10
        ) * 12;

        push();

        translate(pos.x, pos.y);

        rotate(angle - restAngle + wiggle);

        line(0, 0, 0, -legLen);

        pop();

        push();

        translate(pos.x, pos.y);

        rotate(angle + restAngle - wiggle);

        line(0, 0, 0, legLen);

        pop();
    }


    // ==================================================
    // TOUCH DETECTION
    // ==================================================

    containsPoint(px, py) {

        for (let i = 0; i < 6; i++) {

            if (
                dist(
                    px, py,
                    this.history[i].x,
                    this.history[i].y
                ) < 22
            ) {
                return true;
            }
        }

        return false;
    }

}


// ==================================================
// HEART PARTICLES
// ==================================================

class HeartParticle {

    constructor(x, y) {

        this.x = x + random(-10, 10);
        this.y = y + random(-10, 10);

        this.vy = random(-2, -0.8);
        this.vx = random(-0.5, 0.5);

        this.alpha = 255;
        this.size = random(16, 24);
    }


    update() {

        this.x += this.vx;
        this.y += this.vy;

        this.alpha -= 4;
    }


    display() {

        push();

        translate(this.x, this.y);

        textSize(this.size);
        textAlign(CENTER, CENTER);

        fill(220, 50, 90, this.alpha);

        text('❤️', 0, 0);

        pop();
    }


    isDead() {

        return this.alpha <= 0;
    }

}


function spawnHearts(x, y, count = 3) {

    for (let i = 0; i < count; i++) {

        heartParticles.push(
            new HeartParticle(x, y)
        );
    }
}


// ==================================================
// USER INTERACTION
// ==================================================

function mousePressed() {

    handleInteraction(mouseX, mouseY);
}


function touchStarted() {

    if (touches.length > 0) {

        handleInteraction(
            touches[0].x,
            touches[0].y
        );
    }

    return false;
}


function handleInteraction(ix, iy) {

    if (lizard.containsPoint(ix, iy)) {

        spawnHearts(
            lizard.history[0].x,
            lizard.history[0].y,
            5
        );

        return;
    }

    pinkFood.push(
        createVector(ix, iy)
    );
}


// ==================================================
// RESIZE
// ==================================================

function windowResized() {

    resizeCanvas(windowWidth, windowHeight);

    initScreenEdgeMold();

    // Clear previous target and its blacklist
    lizard.currentTarget = null;
    abandonedTargets = new WeakSet();
}

</script>
</body>
</html>
