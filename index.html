<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Terrarium - Fullscreen</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    let moldParticles = [];
    let spatialGrid = {}; // Grid to enforce strict non-overlapping for green particles
    let cellSize = 10;
    let pinkFood = [];
    let heartParticles = [];
    let lizard;

    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      angleMode(DEGREES);

      // Instantiate Lizard securely in the exact center of the screen
      lizard = new Lizard(width / 2, height / 2);

      // Populate full screen edges with initial solid mold coating
      initScreenEdgeMold();
    }

    function getKey(x, y) {
      return floor(x / cellSize) + "," + floor(y / cellSize);
    }

    function addSpatial(p) {
      let k = getKey(p.x, p.y);
      if (!spatialGrid[k]) spatialGrid[k] = [];
      spatialGrid[k].push(p);
    }

    function removeSpatial(p) {
      let k = getKey(p.x, p.y);
      if (spatialGrid[k]) {
        let idx = spatialGrid[k].indexOf(p);
        if (idx !== -1) spatialGrid[k].splice(idx, 1);
      }
    }

    function checkOverlap(x, y, minDist = 4) {
      let cx = floor(x / cellSize);
      let cy = floor(y / cellSize);
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          let k = (cx + dx) + "," + (cy + dy);
          let cell = spatialGrid[k];
          if (cell) {
            for (let p of cell) {
              if (dist(x, y, p.x, p.y) < minDist) {
                return true;
              }
            }
          }
        }
      }
      return false;
    }

    function initScreenEdgeMold() {
      moldParticles = [];
      spatialGrid = {};
      
      // Top & Bottom edges
      for (let x = 10; x < width - 10; x += 6) {
        let p1 = new MoldParticle(x, 6);
        let p2 = new MoldParticle(x, height - 6);
        moldParticles.push(p1); addSpatial(p1);
        moldParticles.push(p2); addSpatial(p2);
      }
      // Left & Right edges
      for (let y = 10; y < height - 10; y += 6) {
        let p1 = new MoldParticle(6, y);
        let p2 = new MoldParticle(width - 6, y);
        moldParticles.push(p1); addSpatial(p1);
        moldParticles.push(p2); addSpatial(p2);
      }
    }

    function draw() {
      // 1. Layer 1: Full window light grey background
      background(235, 235, 235);

      // 2. Layer 2: Mold Growth - Spawns adjacent to existing particles, weighted toward center
      if (moldParticles.length < 5500 && frameCount % 1 === 0) {
        // Pick an existing mold particle to branch from, biased toward those closer to the center
        let parent = null;
        let center = createVector(width / 2, height / 2);
        
        // Try a few random picks and choose the one closer to center to create directional growth
        for (let attempt = 0; attempt < 5; attempt++) {
          let candidate = random(moldParticles);
          if (candidate) {
            if (!parent || dist(candidate.x, candidate.y, center.x, center.y) < dist(parent.x, parent.y, center.x, center.y)) {
              parent = candidate;
            }
          }
        }

        if (parent) {
          // Angle pointing from parent towards center + slight variation
          let centerAngle = atan2(center.y - parent.y, center.x - parent.x);
          let angle = centerAngle + random(-35, 35);
          let stepDist = 5.5; // Adjacent spacing distance
          let nx = parent.x + cos(angle) * stepDist;
          let ny = parent.y + sin(angle) * stepDist;

          // Ensure within screen bounds and strictly non-overlapping
          let dCenter = dist(nx, ny, center.x, center.y);
          if (nx > 15 && nx < width - 15 && ny > 15 && ny < height - 15 && dCenter < min(width, height) * 0.48) {
            if (!checkOverlap(nx, ny, 3.8)) {
              let newP = new MoldParticle(nx, ny);
              moldParticles.push(newP);
              addSpatial(newP);
            }
          }
        }
      }

      // Render Mold Particles
      noStroke();
      fill(100, 190, 80, 220);
      for (let i = 0; i < moldParticles.length; i++) {
        let p = moldParticles[i];
        circle(p.x, p.y, 3.5);
      }

      // Draw Pink Dot Snacks spawned by user tapping
      for (let i = pinkFood.length - 1; i >= 0; i--) {
        let f = pinkFood[i];
        fill(255, 105, 180);
        stroke(255, 192, 203);
        strokeWeight(1.5);
        circle(f.x, f.y, 10 + sin(frameCount * 10 + i) * 2);
      }

      // 3. Update & Draw Layer 3: Orange Lizard
      lizard.update();
      lizard.display();

      // 4. Update & Draw Layer 4: Floating Hearts & Interactive FX
      for (let i = heartParticles.length - 1; i >= 0; i--) {
        let hp = heartParticles[i];
        hp.update();
        hp.display();
        if (hp.isDead()) {
          heartParticles.splice(i, 1);
        }
      }
    }

    class MoldParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
      }
    }

    // Lizard Class with robust targeting, 5-second timeout, and smooth motion
    class Lizard {
      constructor(x, y) {
        this.numSegments = 16;
        this.segmentLen = 10; 
        this.history = [];
        this.headAngle = 0;
        this.speed = 2.0;
        this.currentTarget = null;
        this.targetStartTime = 0;

        for (let i = 0; i < this.numSegments; i++) {
          this.history.push(createVector(x - i * this.segmentLen, y));
        }
      }

      update() {
        let head = this.history[0].copy();
        let center = createVector(width / 2, height / 2);

        // 1. Verify if current target is still active/valid
        let targetValid = false;
        if (this.currentTarget) {
          if (this.currentTarget.type === 'pink') {
            targetValid = pinkFood.includes(this.currentTarget.ref);
          } else if (this.currentTarget.type === 'mold') {
            targetValid = moldParticles.includes(this.currentTarget.ref);
          }
        }

        // Switch target if invalid or 5 seconds elapsed
        if (!targetValid || (millis() - this.targetStartTime > 5000)) {
          this.currentTarget = null;
        }

        // 2. Select closest edible particle to center
        if (!this.currentTarget) {
          let bestTarget = null;
          let minCenterDist = Infinity;
          let targetType = null;

          // Prioritize pink food closest to center
          for (let f of pinkFood) {
            let dCenter = dist(f.x, f.y, center.x, center.y);
            if (dCenter < minCenterDist) {
              minCenterDist = dCenter;
              bestTarget = f;
              targetType = 'pink';
            }
          }

          // Otherwise find closest mold particle to center
          if (!bestTarget) {
            for (let p of moldParticles) {
              if (p.x > 25 && p.x < width - 25 && p.y > 25 && p.y < height - 25) {
                let dCenter = dist(p.x, p.y, center.x, center.y);
                if (dCenter < minCenterDist) {
                  minCenterDist = dCenter;
                  bestTarget = p;
                  targetType = 'mold';
                }
              }
            }
          }

          if (bestTarget) {
            this.currentTarget = { type: targetType, ref: bestTarget };
            this.targetStartTime = millis();
          }
        }

        let targetPos;
        if (this.currentTarget) {
          targetPos = createVector(this.currentTarget.ref.x, this.currentTarget.ref.y);
        } else {
          // Wander gracefully across screen if nothing is available
          targetPos = createVector(
            width / 2 + cos(frameCount * 0.8) * (width * 0.25),
            height / 2 + sin(frameCount * 0.6) * (height * 0.25)
          );
        }

        // Smooth turning
        let desiredAngle = atan2(targetPos.y - head.y, targetPos.x - head.x);
        let angleDiff = (desiredAngle - this.headAngle + 540) % 360 - 180;
        this.headAngle += constrain(angleDiff, -1.5, 1.5);

        let nextHead = createVector(
          head.x + cos(this.headAngle) * this.speed,
          head.y + sin(this.headAngle) * this.speed
        );

        // Self-collision prevention
        for (let i = 4; i < this.history.length; i++) {
          if (p5.Vector.dist(nextHead, this.history[i]) < this.segmentLen * 0.9) {
            this.headAngle += 15;
            nextHead = createVector(
              head.x + cos(this.headAngle) * this.speed,
              head.y + sin(this.headAngle) * this.speed
            );
            break;
          }
        }

        // Keep inside 25px window margin
        let margin = 25;
        if (nextHead.x < margin || nextHead.x > width - margin || nextHead.y < margin || nextHead.y > height - margin) {
          let angleToCenter = atan2(height / 2 - nextHead.y, width / 2 - nextHead.x);
          this.headAngle = angleToCenter;
          nextHead.x = constrain(nextHead.x, margin, width - margin);
          nextHead.y = constrain(nextHead.y, margin, height - margin);
        }

        // Update snake body chain
        this.history[0] = nextHead;
        for (let i = 1; i < this.history.length; i++) {
          let prev = this.history[i - 1];
          let curr = this.history[i];
          let dir = p5.Vector.sub(prev, curr);
          dir.setMag(this.segmentLen);
          let targetPosSegment = p5.Vector.sub(prev, dir);

          let overlapping = false;
          for (let j = 0; j < this.history.length; j++) {
            if (abs(i - j) > 1 && p5.Vector.dist(targetPosSegment, this.history[j]) < this.segmentLen * 0.6) {
              overlapping = true;
              break;
            }
          }

          if (!overlapping) {
            this.history[i] = targetPosSegment;
          } else {
            let nudgeAngle = random(360);
            this.history[i] = createVector(prev.x + cos(nudgeAngle) * this.segmentLen, prev.y + sin(nudgeAngle) * this.segmentLen);
          }
        }

        // Eat Pink Food
        for (let i = pinkFood.length - 1; i >= 0; i--) {
          if (dist(nextHead.x, nextHead.y, pinkFood[i].x, pinkFood[i].y) < 20) {
            pinkFood.splice(i, 1);
            spawnHearts(nextHead.x, nextHead.y, 4);
          }
        }

        // Eat Mold Particles
        for (let i = moldParticles.length - 1; i >= 0; i--) {
          let p = moldParticles[i];
          if (dist(nextHead.x, nextHead.y, p.x, p.y) < 16) {
            removeSpatial(p);
            moldParticles.splice(i, 1);
          }
        }
      }

      display() {
        noStroke();
        this.drawLegPair(4, 20, 40);
        this.drawLegPair(11, 16, 50);

        // Draw Orange Body Segments
        for (let i = this.history.length - 1; i >= 0; i--) {
          let pos = this.history[i];
          let size = map(i, 0, this.history.length - 1, 22, 14);

          fill(240, 130, 40);
          stroke(180, 80, 20);
          strokeWeight(2);
          circle(pos.x, pos.y, size);
        }

        // Draw Orange Head & White Eyes
        let head = this.history[0];
        push();
        translate(head.x, head.y);
        rotate(this.headAngle);
        fill(250, 140, 50);
        stroke(180, 80, 20);
        strokeWeight(2);
        ellipse(2, 0, 28, 22);

        // White Eyes with dark pupils
        fill(255, 255, 255);
        noStroke();
        ellipse(6, -6, 7, 7);
        ellipse(6, 6, 7, 7);
        fill(30);
        ellipse(7, -6, 3, 4);
        ellipse(7, 6, 3, 4);
        pop();
      }

      drawLegPair(segmentIdx, legLen, restAngle) {
        if (segmentIdx >= this.history.length) return;
        let pos = this.history[segmentIdx];
        let prev = this.history[segmentIdx - 1];
        let angle = atan2(pos.y - prev.y, pos.x - prev.x);

        stroke(200, 100, 30);
        strokeWeight(4);
        strokeCap(ROUND);

        let wiggle = sin(frameCount * 12 + segmentIdx * 10) * 12;

        push();
        translate(pos.x, pos.y);
        rotate(angle - restAngle + wiggle);
        line(0, 0, 0, -legLen);
        pop();

        push();
        translate(pos.x, pos.y);
        rotate(angle + restAngle - wiggle);
        line(0, 0, 0, legLen);
        pop();
      }

      containsPoint(px, py) {
        for (let i = 0; i < 6; i++) {
          if (dist(px, py, this.history[i].x, this.history[i].y) < 22) {
            return true;
          }
        }
        return false;
      }
    }

    class HeartParticle {
      constructor(x, y) {
        this.x = x + random(-10, 10);
        this.y = y + random(-10, 10);
        this.vy = random(-2, -0.8);
        this.vx = random(-0.5, 0.5);
        this.alpha = 255;
        this.size = random(16, 24);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 4;
      }

      display() {
        push();
        translate(this.x, this.y);
        textSize(this.size);
        textAlign(CENTER, CENTER);
        fill(220, 50, 90, this.alpha);
        text('❤️', 0, 0);
        pop();
      }

      isDead() {
        return this.alpha <= 0;
      }
    }

    function spawnHearts(x, y, count = 3) {
      for (let i = 0; i < count; i++) {
        heartParticles.push(new HeartParticle(x, y));
      }
    }

    function mousePressed() {
      handleInteraction(mouseX, mouseY);
    }

    function touchStarted() {
      if (touches.length > 0) {
        handleInteraction(touches[0].x, touches[0].y);
      }
      return false;
    }

    function handleInteraction(ix, iy) {
      if (lizard.containsPoint(ix, iy)) {
        spawnHearts(lizard.history[0].x, lizard.history[0].y, 5);
        return;
      }

      pinkFood.push(createVector(ix, iy));
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      initScreenEdgeMold();
    }
  </script>
</body>
</html>
