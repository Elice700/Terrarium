<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Terrarium - Fullscreen</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    let moldParticles = [];
    let pinkFood = [];
    let heartParticles = [];
    let lizard;

    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      angleMode(DEGREES);

      // Instantiate Lizard in the center
      lizard = new Lizard(width / 2, height / 2);

      // Populate full screen edges with initial solid mold coating
      initScreenEdgeMold();
    }

    function initScreenEdgeMold() {
      moldParticles = [];
      // Top & Bottom edges
      for (let x = 0; x < width; x += 10) {
        moldParticles.push(new MoldNode(x, 4));
        moldParticles.push(new MoldNode(x, height - 4));
      }
      // Left & Right edges
      for (let y = 0; y < height; y += 10) {
        moldParticles.push(new MoldNode(4, y));
        moldParticles.push(new MoldNode(width - 4, y));
      }
    }

    function draw() {
      // 1. Layer 1: Full window light grey background
      background(235, 235, 235);

      // 2. Layer 2: Mold Growth - high spawn rate, covering edges and stacking into inward strands
      if (moldParticles.length < 7000) {
        let side = floor(random(4));
        let sx, sy;
        if (side === 0) { sx = random(width); sy = random(0, 8); }
        else if (side === 1) { sx = random(width); sy = height - random(0, 8); }
        else if (side === 2) { sx = random(0, 8); sy = random(height); }
        else { sx = width - random(0, 8); sy = random(height); }
        moldParticles.push(new MoldNode(sx, sy));

        let parent = random(moldParticles);
        if (parent) {
          let centerAngle = atan2(height / 2 - parent.y, width / 2 - parent.x);
          let angle = centerAngle + random(-25, 25);
          let nx = parent.x + cos(angle) * 4.5;
          let ny = parent.y + sin(angle) * 4.5;

          let dCenter = dist(nx, ny, width / 2, height / 2);
          if (dCenter > 120 && nx > 10 && nx < width - 10 && ny > 10 && ny < height - 10) {
            moldParticles.push(new MoldNode(nx, ny));
          }
        }
      }

      // Render Mold Particles
      noStroke();
      fill(100, 190, 80, 220);
      for (let i = 0; i < moldParticles.length; i++) {
        let p = moldParticles[i];
        circle(p.x, p.y, 3.5);
      }

      // Draw Pink Dot Snacks spawned by user tapping
      for (let i = pinkFood.length - 1; i >= 0; i--) {
        let f = pinkFood[i];
        fill(255, 105, 180);
        stroke(255, 192, 203);
        strokeWeight(1.5);
        circle(f.x, f.y, 10 + sin(frameCount * 10 + i) * 2);
      }

      // 3. Update & Draw Layer 3: Orange Lizard with non-overlapping non-adjacent body parts & very smooth turning
      lizard.update();
      lizard.display();

      // 4. Update & Draw Layer 4: Floating Hearts & Interactive FX
      for (let i = heartParticles.length - 1; i >= 0; i--) {
        let hp = heartParticles[i];
        hp.update();
        hp.display();
        if (hp.isDead()) {
          heartParticles.splice(i, 1);
        }
      }
    }

    class MoldNode {
      constructor(x, y) {
        this.x = x;
        this.y = y;
      }
    }

    // Lizard Class (Very stiff turning angle, strict non-adjacent overlap prevention)
    class Lizard {
      constructor(x, y) {
        this.numSegments = 18;
        this.segmentLen = 9; 
        this.history = [];
        this.headAngle = 0;
        this.speed = 2.2;

        for (let i = 0; i < this.numSegments; i++) {
          this.history.push(createVector(x - i * this.segmentLen, y));
        }
      }

      update() {
        let head = this.history[0].copy();
        let target = null;
        let minDist = Infinity;

        // Priority 1: Pink food
        for (let f of pinkFood) {
          let d = dist(head.x, head.y, f.x, f.y);
          if (d < minDist) {
            minDist = d;
            target = createVector(f.x, f.y);
          }
        }

        // Priority 2: Mold closest to center
        if (!target) {
          let center = createVector(width / 2, height / 2);
          for (let p of moldParticles) {
            let distFromCenter = dist(p.x, p.y, center.x, center.y);
            let distFromHead = dist(p.x, p.y, head.x, head.y);
            if (distFromCenter < min(width, height) * 0.42 && distFromHead < minDist) {
              minDist = distFromHead;
              target = createVector(p.x, p.y);
            }
          }
        }

        // Wander fallback across the window middle area
        if (!target) {
          let wanderX = width / 2 + cos(frameCount * 1.0) * (width * 0.28);
          let wanderY = height / 2 + sin(frameCount * 0.8) * (height * 0.28);
          target = createVector(wanderX, wanderY);
        }

        // Extremely low turning rate (way less bendy / very smooth curves)
        let desiredAngle = atan2(target.y - head.y, target.x - head.x);
        let angleDiff = (desiredAngle - this.headAngle + 540) % 360 - 180;
        this.headAngle += constrain(angleDiff, -1.0, 1.0);

        let nextHead = createVector(
          head.x + cos(this.headAngle) * this.speed,
          head.y + sin(this.headAngle) * this.speed
        );

        // Strict non-adjacent overlap prevention (preventing any non-adjacent body parts from overlapping)
        for (let i = 4; i < this.history.length; i++) {
          if (p5.Vector.dist(nextHead, this.history[i]) < this.segmentLen * 0.95) {
            this.headAngle += 10;
            nextHead = createVector(
              head.x + cos(this.headAngle) * this.speed,
              head.y + sin(this.headAngle) * this.speed
            );
            break;
          }
        }

        // Full window freedom boundary
        let distFromCenter = dist(nextHead.x, nextHead.y, width / 2, height / 2);
        let maxLizardRadius = min(width, height) * 0.44;
        if (distFromCenter > maxLizardRadius) {
          let angleToCenter = atan2(height / 2 - nextHead.y, width / 2 - nextHead.x);
          this.headAngle = angleToCenter;
        }

        // Update body chain with solid segments
        this.history[0] = nextHead;
        for (let i = 1; i < this.history.length; i++) {
          let prev = this.history[i - 1];
          let curr = this.history[i];
          let dir = p5.Vector.sub(prev, curr);
          dir.setMag(this.segmentLen);
          let targetPos = p5.Vector.sub(prev, dir);

          // Check against non-adjacent overlap for internal segments as well
          let overlapping = false;
          for (let j = 0; j < this.history.length; j++) {
            if (abs(i - j) > 1 && p5.Vector.dist(targetPos, this.history[j]) < this.segmentLen * 0.7) {
              overlapping = true;
              break;
            }
          }

          if (!overlapping) {
            this.history[i] = targetPos;
          } else {
            // Push slightly outward if overlap detected
            let nudgeAngle = random(360);
            this.history[i] = createVector(prev.x + cos(nudgeAngle) * this.segmentLen, prev.y + sin(nudgeAngle) * this.segmentLen);
          }
        }

        // Eat Pink Food
        for (let i = pinkFood.length - 1; i >= 0; i--) {
          if (dist(nextHead.x, nextHead.y, pinkFood[i].x, pinkFood[i].y) < 18) {
            pinkFood.splice(i, 1);
            spawnHearts(nextHead.x, nextHead.y, 4);
          }
        }

        // Eat Mold Particles
        for (let i = moldParticles.length - 1; i >= 0; i--) {
          if (dist(nextHead.x, nextHead.y, moldParticles[i].x, moldParticles[i].y) < 15) {
            moldParticles.splice(i, 1);
          }
        }
      }

      display() {
        noStroke();
        this.drawLegPair(4, 22, 40);
        this.drawLegPair(11, 18, 50);

        // Draw Orange Overlapping Body Segments
        for (let i = this.history.length - 1; i >= 0; i--) {
          let pos = this.history[i];
          let size = map(i, 0, this.history.length - 1, 22, 14);

          fill(240, 130, 40);
          stroke(180, 80, 20);
          strokeWeight(2);
          circle(pos.x, pos.y, size);
        }

        // Draw Orange Head & White Eyes
        let head = this.history[0];
        push();
        translate(head.x, head.y);
        rotate(this.headAngle);
        fill(250, 140, 50);
        stroke(180, 80, 20);
        strokeWeight(2);
        ellipse(2, 0, 28, 22);

        // White Eyes with dark pupils
        fill(255, 255, 255);
        noStroke();
        ellipse(6, -6, 7, 7);
        ellipse(6, 6, 7, 7);
        fill(30);
        ellipse(7, -6, 3, 4);
        ellipse(7, 6, 3, 4);
        pop();
      }

      drawLegPair(segmentIdx, legLen, restAngle) {
        if (segmentIdx >= this.history.length) return;
        let pos = this.history[segmentIdx];
        let prev = this.history[segmentIdx - 1];
        let angle = atan2(pos.y - prev.y, pos.x - prev.x);

        stroke(200, 100, 30);
        strokeWeight(4);
        strokeCap(ROUND);

        let wiggle = sin(frameCount * 12 + segmentIdx * 10) * 12;

        push();
        translate(pos.x, pos.y);
        rotate(angle - restAngle + wiggle);
        line(0, 0, 0, -legLen);
        pop();

        push();
        translate(pos.x, pos.y);
        rotate(angle + restAngle - wiggle);
        line(0, 0, 0, legLen);
        pop();
      }

      containsPoint(px, py) {
        for (let i = 0; i < 6; i++) {
          if (dist(px, py, this.history[i].x, this.history[i].y) < 22) {
            return true;
          }
        }
        return false;
      }
    }

    class HeartParticle {
      constructor(x, y) {
        this.x = x + random(-10, 10);
        this.y = y + random(-10, 10);
        this.vy = random(-2, -0.8);
        this.vx = random(-0.5, 0.5);
        this.alpha = 255;
        this.size = random(16, 24);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 4;
      }

      display() {
        push();
        translate(this.x, this.y);
        textSize(this.size);
        textAlign(CENTER, CENTER);
        fill(220, 50, 90, this.alpha);
        text('❤️', 0, 0);
        pop();
      }

      isDead() {
        return this.alpha <= 0;
      }
    }

    function spawnHearts(x, y, count = 3) {
      for (let i = 0; i < count; i++) {
        heartParticles.push(new HeartParticle(x, y));
      }
    }

    function mousePressed() {
      handleInteraction(mouseX, mouseY);
    }

    function touchStarted() {
      if (touches.length > 0) {
        handleInteraction(touches[0].x, touches[0].y);
      }
      return false;
    }

    function handleInteraction(ix, iy) {
      if (lizard.containsPoint(ix, iy)) {
        spawnHearts(lizard.history[0].x, lizard.history[0].y, 5);
        return;
      }

      pinkFood.push(createVector(ix, iy));
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      initScreenEdgeMold();
    }
  </script>
</body>
</html>
