
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terrarium</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d1ecf0;
    touch-action: manipulation;
  }

  canvas {
    display: block;
    touch-action: manipulation;
  }
</style>
</head>

<body>
<script>
let mold = [];
let pinkFood = [];
let hearts = [];
let lizard;

let moldRadius;
let moldSpacing;
let lastGrowth = 0;
let nextFoodId = 0;

const BACKGROUND = "#d1ecf0";
const MAX_MOLD = 1800;

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);

  calculateDimensions();
  seedMold();

  lizard = new Lizard();
}

function calculateDimensions() {
  const s = min(width, height);

  moldRadius = s * 0.008;
  moldSpacing = s * 0.028;
}

function draw() {
  background(BACKGROUND);

  growMold();
  updateMold();
  updatePinkFood();
  updateHearts();

  lizard.update();
  lizard.draw();
}

// --------------------------------------------------
// MOLD
// --------------------------------------------------

class MoldParticle {
  constructor(x, y, initial = false) {
    this.pos = createVector(x, y);
    this.initial = initial;
    this.radius = moldRadius * random(0.75, 1.3);

    this.alive = true;
    this.growthCount = 0;
    this.lastGrowth = 0;

    this.shade = random(-15, 15);
    this.wobble = random(TWO_PI);
  }

  draw() {
    if (!this.alive) return;

    const pulse = sin(frameCount * 0.025 + this.wobble) * 0.08;
    const r = this.radius * (1 + pulse);

    noStroke();
    fill(
      constrain(76 + this.shade, 0, 255),
      constrain(158 + this.shade, 0, 255),
      constrain(78 + this.shade * 0.5, 0, 255),
      235
    );

    circle(this.pos.x, this.pos.y, r * 2);

    fill(130, 195, 112, 90);
    circle(
      this.pos.x - r * 0.2,
      this.pos.y - r * 0.2,
      r * 0.65
    );
  }
}

function seedMold() {
  mold = [];

  const spacing = moldSpacing * 1.25;
  const inset = moldSpacing * 0.35;

  // Top and bottom edges
  for (let x = 0; x <= width; x += spacing) {
    mold.push(new MoldParticle(
      constrain(x + random(-2, 2), 0, width),
      inset + random(-inset * 0.4, inset * 0.4),
      true
    ));

    mold.push(new MoldParticle(
      constrain(x + random(-2, 2), 0, width),
      height - inset + random(-inset * 0.4, inset * 0.4),
      true
    ));
  }

  // Left and right edges
  for (let y = spacing; y < height; y += spacing) {
    mold.push(new MoldParticle(
      inset + random(-inset * 0.4, inset * 0.4),
      y,
      true
    ));

    mold.push(new MoldParticle(
      width - inset + random(-inset * 0.4, inset * 0.4),
      y,
      true
    ));
  }
}

function growMold() {
  if (mold.length >= MAX_MOLD) return;
  if (millis() - lastGrowth < 180) return;

  lastGrowth = millis();

  // Several attempts per growth cycle make growth reliable
  // even when some candidate positions are blocked.
  for (let attempt = 0; attempt < 14; attempt++) {
    if (mold.length >= MAX_MOLD) break;

    const parent = random(mold);

    if (!parent || !parent.alive) continue;
    if (parent.growthCount >= 5) continue;

    const center = createVector(width / 2, height / 2);
    const inward = p5.Vector.sub(center, parent.pos);

    if (inward.magSq() < 1) continue;

    inward.normalize();
    inward.rotate(random(-0.8, 0.8));

    const distance = moldSpacing * random(0.8, 1.15);
    const candidate = p5.Vector.add(
      parent.pos,
      p5.Vector.mult(inward, distance)
    );

    // Keep the new particle inside the viewport.
    const edgePadding = moldRadius * 1.5;

    if (
      candidate.x < edgePadding ||
      candidate.x > width - edgePadding ||
      candidate.y < edgePadding ||
      candidate.y > height - edgePadding
    ) continue;

    // Growth must move toward the centre.
    const oldDistance = dist(
      parent.pos.x, parent.pos.y,
      center.x, center.y
    );

    const newDistance = dist(
      candidate.x, candidate.y,
      center.x, center.y
    );

    if (newDistance >= oldDistance) continue;

    // Avoid placing particles directly on top of each other.
    let crowded = false;

    for (let i = 0; i < mold.length; i++) {
      const other = mold[i];

      if (!other.alive) continue;

      if (p5.Vector.dist(candidate, other.pos) <
          moldRadius * 2.1) {
        crowded = true;
        break;
      }
    }

    if (crowded) continue;

    mold.push(new MoldParticle(
      candidate.x,
      candidate.y,
      false
    ));

    parent.growthCount++;
  }
}

function updateMold() {
  for (const particle of mold) {
    particle.draw();
  }
}

// --------------------------------------------------
// PINK FOOD
// --------------------------------------------------

class PinkParticle {
  constructor(x, y) {
    this.pos = createVector(x, y);
    this.radius = moldRadius * random(1.3, 1.8);
    this.id = nextFoodId++;
    this.alive = true;
    this.wobble = random(TWO_PI);
  }

  draw() {
    if (!this.alive) return;

    const pulse = 1 + sin(frameCount * 0.06 + this.wobble) * 0.1;

    noStroke();
    fill(255, 115, 174, 235);
    circle(this.pos.x, this.pos.y, this.radius * 2 * pulse);

    fill(255, 205, 225, 180);
    circle(
      this.pos.x - this.radius * 0.25,
      this.pos.y - this.radius * 0.25,
      this.radius * 0.65
    );
  }
}

function spawnPinkFood(x, y) {
  pinkFood.push(new PinkParticle(x, y));
}

function updatePinkFood() {
  for (const food of pinkFood) {
    food.draw();
  }

  pinkFood = pinkFood.filter(food => food.alive);
}

// --------------------------------------------------
// HEARTS
// --------------------------------------------------

class Heart {
  constructor(x, y) {
    this.pos = createVector(x, y);
    this.vel = createVector(random(-0.5, 0.5), random(-1.8, -0.8));
    this.life = 255;
    this.size = random(12, 21);
  }

  update() {
    this.pos.add(this.vel);
    this.vel.mult(0.985);
    this.life -= 3;
  }

  draw() {
    push();
    translate(this.pos.x, this.pos.y);
    noStroke();
    fill(255, 105, 155, this.life);
    textAlign(CENTER, CENTER);
    textSize(this.size);
    text("♥", 0, 0);
    pop();
  }
}

function updateHearts() {
  for (const heart of hearts) {
    heart.update();
    heart.draw();
  }

  hearts = hearts.filter(h => h.life > 0);
}

// --------------------------------------------------
// LIZARD
// --------------------------------------------------

class Lizard {
  constructor() {
    this.scale = min(width, height);

    // Requested margin: 3% of the shorter screen dimension.
    this.margin = this.scale * 0.03;

    this.bodyRadius = this.scale * 0.012;
    this.segmentSpacing = this.scale * 0.006;
    this.segmentCount = 7;

    this.speed = this.scale * 0.0032;
    this.turnSpeed = 0.085;

    this.pos = createVector(
      width * 0.5,
      height * 0.5
    );

    this.heading = random(TWO_PI);
    this.velocity = p5.Vector.fromAngle(this.heading);

    this.history = [];
    for (let i = 0; i < 300; i++) {
      this.history.push(this.pos.copy());
    }

    this.target = null;
    this.targetType = null;
    this.targetStarted = 0;
    this.abandoned = new WeakSet();

    this.patrolPoints = [];
    this.patrolIndex = 0;
    this.createPatrol();

    this.legPhase = 0;
    this.blinkTimer = 0;
    this.eyeBlink = false;
  }

  createPatrol() {
    this.patrolPoints = [];

    const m = this.margin;
    const usableW = max(1, width - m * 2);
    const usableH = max(1, height - m * 2);

    const cols = 4;
    const rows = 4;

    // A serpentine route covers the whole screen.
    for (let row = 0; row < rows; row++) {
      const y = m + usableH * (row / (rows - 1));

      if (row % 2 === 0) {
        for (let col = 0; col < cols; col++) {
          const x = m + usableW * (col / (cols - 1));
          this.patrolPoints.push(createVector(x, y));
        }
      } else {
        for (let col = cols - 1; col >= 0; col--) {
          const x = m + usableW * (col / (cols - 1));
          this.patrolPoints.push(createVector(x, y));
        }
      }
    }

    this.patrolIndex = 0;
  }

  patrolTarget() {
    if (this.patrolPoints.length === 0) {
      return createVector(width / 2, height / 2);
    }

    let target = this.patrolPoints[this.patrolIndex];

    if (p5.Vector.dist(this.pos, target) < this.scale * 0.045) {
      this.patrolIndex =
        (this.patrolIndex + 1) % this.patrolPoints.length;

      target = this.patrolPoints[this.patrolIndex];
    }

    return target.copy();
  }

  findFood() {
    const localRadius = this.scale * 0.22;
    let best = null;
    let bestType = null;
    let bestScore = Infinity;

    // Newly grown green particles are edible.
    // Original edge particles are deliberately excluded.
    for (const particle of mold) {
      if (!particle.alive || particle.initial) continue;
      if (this.abandoned.has(particle)) continue;

      const distance = p5.Vector.dist(this.pos, particle.pos);
      if (distance > localRadius) continue;

      const centreDistance = dist(
        particle.pos.x,
        particle.pos.y,
        width / 2,
        height / 2
      );

      const score =
        distance * 0.25 +
        centreDistance * 0.75;

      if (score < bestScore) {
        best = particle;
        bestType = "mold";
        bestScore = score;
      }
    }

    // Pink food is a secondary target.
    for (const food of pinkFood) {
      if (!food.alive || this.abandoned.has(food)) continue;

      const distance = p5.Vector.dist(this.pos, food.pos);
      if (distance > localRadius) continue;

      const score = distance + this.scale * 0.12;

      if (score < bestScore) {
        best = food;
        bestType = "pink";
        bestScore = score;
      }
    }

    return best ? { item: best, type: bestType } : null;
  }

  chooseTarget() {
    // Abandon targets that take too long.
    if (
      this.target &&
      millis() - this.targetStarted > 3000
    ) {
      this.abandoned.add(this.target);
      this.target = null;
      this.targetType = null;
    }

    if (this.target) {
      if (!this.target.alive) {
        this.target = null;
        this.targetType = null;
      }
    }

    if (!this.target) {
      const found = this.findFood();

      if (found) {
        this.target = found.item;
        this.targetType = found.type;
        this.targetStarted = millis();
      }
    }
  }

  update() {
    this.chooseTarget();

    let destination = this.patrolTarget();

    // Food causes a local detour, but does not replace patrol.
    if (this.target) {
      destination = this.target.pos.copy();
    }

    const desired = p5.Vector.sub(destination, this.pos);

    if (desired.magSq() > 0.001) {
      desired.normalize();

      const current = p5.Vector.fromAngle(this.heading);
      current.lerp(desired, this.turnSpeed);
      current.normalize();

      this.heading = current.heading();
    }

    this.velocity = p5.Vector.fromAngle(this.heading);
    this.velocity.mult(this.speed);

    this.pos.add(this.velocity);

    // Hard viewport boundaries. The whole body history is also
    // constrained when drawn, so no segment can wander offscreen.
    this.pos.x = constrain(
      this.pos.x,
      this.margin,
      width - this.margin
    );

    this.pos.y = constrain(
      this.pos.y,
      this.margin,
      height - this.margin
    );

    this.history.unshift(this.pos.copy());

    const maxHistory = 300;
    if (this.history.length > maxHistory) {
      this.history.length = maxHistory;
    }

    this.legPhase += 0.22;

    this.checkEating();
  }

  checkEating() {
    if (!this.target) return;

    const reach = this.bodyRadius * 1.8;

    if (p5.Vector.dist(this.pos, this.target.pos) < reach) {
      this.target.alive = false;
      this.target = null;
      this.targetType = null;
    }
  }

  bodyPoint(index) {
    const historyIndex = Math.floor(
      index * this.segmentSpacing / max(1, this.speed)
    );

    const p = this.history[
      min(historyIndex, this.history.length - 1)
    ] || this.pos;

    return createVector(
      constrain(p.x, this.margin, width - this.margin),
      constrain(p.y, this.margin, height - this.margin)
    );
  }

  draw() {
    const points = [];

    for (let i = 0; i <= this.segmentCount * 2; i++) {
      points.push(this.bodyPoint(i * 0.5));
    }

    // Body
    noFill();
    stroke(224, 139, 61);
    strokeWeight(this.bodyRadius * 1.75);
    strokeCap(ROUND);
    strokeJoin(ROUND);

    beginShape();
    curveVertex(points[0].x, points[0].y);

    for (const p of points) {
      curveVertex(p.x, p.y);
    }

    const last = points[points.length - 1];
    curveVertex(last.x, last.y);
    endShape();

    // Body highlights
    noFill();
    stroke(255, 190, 104, 170);
    strokeWeight(this.bodyRadius * 0.35);

    beginShape();
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      curveVertex(p.x, p.y - this.bodyRadius * 0.35);
    }
    endShape();

    // Legs
    this.drawLegs(points);

    // Head
    this.drawHead();
  }

  drawLegs(points) {
    const legIndices = [3, 8, 13];

    for (let i = 0; i < legIndices.length; i++) {
      const index = legIndices[i];
      if (index >= points.length) continue;

      const p = points[index];
      const wave = sin(this.legPhase + i * 1.7);

      const side = i % 2 === 0 ? 1 : -1;

      const angle = this.heading + HALF_PI * side;
      const forward = p5.Vector.fromAngle(
        this.heading + wave * 0.45
      );

      const outward = p5.Vector.fromAngle(angle);
      outward.mult(this.bodyRadius * 1.35);

      const foot = p5.Vector.add(p, outward);
      foot.add(p5.Vector.mult(forward, wave * this.bodyRadius));

      const knee = p5.Vector.add(p, outward.copy().mult(0.55));

      stroke(195, 112, 53);
      strokeWeight(this.bodyRadius * 0.38);
      strokeCap(ROUND);

      line(p.x, p.y, knee.x, knee.y);
      line(knee.x, knee.y, foot.x, foot.y);

      noStroke();
      fill(195, 112, 53);
      circle(foot.x, foot.y, this.bodyRadius * 0.42);
    }
  }

  drawHead() {
    push();
    translate(this.pos.x, this.pos.y);
    rotate(this.heading);

    // Neck
    noStroke();
    fill(224, 139, 61);
    ellipse(-this.bodyRadius * 0.35, 0,
      this.bodyRadius * 1.8,
      this.bodyRadius * 1.35);

    // Head shape
    fill(237, 157, 76);
    ellipse(
      this.bodyRadius * 0.45,
      0,
      this.bodyRadius * 2.2,
      this.bodyRadius * 1.65
    );

    // Snout
    fill(245, 177, 91);
    ellipse(
      this.bodyRadius * 1.25,
      0,
      this.bodyRadius * 1.1,
      this.bodyRadius * 0.9
    );

    // Eyes
    fill(255);
    circle(
      this.bodyRadius * 0.4,
      -this.bodyRadius * 0.48,
      this.bodyRadius * 0.62
    );

    circle(
      this.bodyRadius * 0.4,
      this.bodyRadius * 0.48,
      this.bodyRadius * 0.62
    );

    fill(45, 40, 35);
    circle(
      this.bodyRadius * 0.55,
      -this.bodyRadius * 0.48,
      this.bodyRadius * 0.27
    );

    circle(
      this.bodyRadius * 0.55,
      this.bodyRadius * 0.48,
      this.bodyRadius * 0.27
    );

    // Tiny nostril
    fill(130, 77, 43);
    circle(
      this.bodyRadius * 1.55,
      -this.bodyRadius * 0.12,
      this.bodyRadius * 0.12
    );

    pop();
  }

  resize() {
    this.scale = min(width, height);

    // Requested 3% margin, updated after screen rotation/resizing.
    this.margin = this.scale * 0.03;

    this.bodyRadius = this.scale * 0.012;
    this.segmentSpacing = this.scale * 0.006;
    this.speed = this.scale * 0.0032;

    this.pos.x = constrain(this.pos.x, this.margin, width - this.margin);
    this.pos.y = constrain(this.pos.y, this.margin, height - this.margin);

    this.target = null;
    this.targetType = null;

    this.history = [];
    for (let i = 0; i < 300; i++) {
      this.history.push(this.pos.copy());
    }

    this.createPatrol();
  }
}

// --------------------------------------------------
// INTERACTION
// --------------------------------------------------

function handleTap(x, y) {
  if (!lizard) return;

  const headDistance = dist(
    x, y,
    lizard.pos.x,
    lizard.pos.y
  );

  if (headDistance < lizard.bodyRadius * 3.5) {
    for (let i = 0; i < 5; i++) {
      hearts.push(new Heart(
        lizard.pos.x + random(-12, 12),
        lizard.pos.y - random(5, 15)
      ));
    }
  } else {
    spawnPinkFood(x, y);
  }
}

function mousePressed() {
  handleTap(mouseX, mouseY);
  return false;
}

function touchStarted() {
  if (touches.length > 0) {
    handleTap(touches[0].x, touches[0].y);
  }
  return false;
}

// --------------------------------------------------
// RESIZING
// --------------------------------------------------

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);

  calculateDimensions();

  if (lizard) {
    lizard.resize();
  }
}
</script>
</body>
</html>
