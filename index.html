
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terrarium</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #777;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<script>
let moldParticles = [];
let pinkFood = [];
let heartParticles = [];
let growthFrontier = [];
let lizard;

let lastGrowth = 0;
let growthInterval = 230;
let maxMold = 1800;

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  initScreenEdgeMold();
  lizard = new Lizard();
}

function draw() {
  background(112, 115, 112);

  growMold();
  displayMold();

  for (let i = pinkFood.length - 1; i >= 0; i--) {
    const f = pinkFood[i];
    fill(255, 130, 190);
    noStroke();
    circle(f.x, f.y, f.r * 2);
    fill(255, 210, 230, 130);
    circle(f.x - f.r * 0.25, f.y - f.r * 0.25, f.r * 0.65);
  }

  lizard.update();
  lizard.display();

  for (let i = heartParticles.length - 1; i >= 0; i--) {
    heartParticles[i].update();
    heartParticles[i].display();
    if (heartParticles[i].life <= 0) heartParticles.splice(i, 1);
  }
}

// --------------------------------------------------
// MOLD
// --------------------------------------------------

class MoldParticle {
  constructor(x, y, r = 4) {
    this.x = x;
    this.y = y;
    this.r = r;
    this.children = 0;
    this.cooldown = random(0, 500);
    this.alive = true;
  }
}

function initScreenEdgeMold() {
  moldParticles = [];
  growthFrontier = [];

  const spacing = max(13, min(width, height) * 0.035);
  const r = max(2.5, min(width, height) * 0.009);

  // Top and bottom edges
  for (let x = 0; x <= width; x += spacing) {
    addMold(x + random(-2, 2), random(0, spacing * 0.6), r);
    addMold(x + random(-2, 2), height - random(0, spacing * 0.6), r);
  }

  // Left and right edges
  for (let y = spacing; y < height; y += spacing) {
    addMold(random(0, spacing * 0.6), y + random(-2, 2), r);
    addMold(width - random(0, spacing * 0.6), y + random(-2, 2), r);
  }
}

function addMold(x, y, r) {
  const p = new MoldParticle(
    constrain(x, 0, width),
    constrain(y, 0, height),
    r
  );

  // Avoid excessive overlap during initial seeding.
  for (const other of moldParticles) {
    if (dist(p.x, p.y, other.x, other.y) < (p.r + other.r) * 0.85) {
      return null;
    }
  }

  moldParticles.push(p);
  growthFrontier.push(p);
  return p;
}

function growMold() {
  if (millis() - lastGrowth < growthInterval) return;
  lastGrowth = millis();

  if (moldParticles.length >= maxMold || growthFrontier.length === 0) return;

  // Try several parents so one blocked branch cannot stall growth.
  for (let attempt = 0; attempt < 12; attempt++) {
    const parent = random(growthFrontier);
    if (!parent || !parent.alive) continue;

    if (parent.children >= 5) {
      growthFrontier = growthFrontier.filter(p => p !== parent);
      continue;
    }

    const cx = width / 2;
    const cy = height / 2;

    const dx = cx - parent.x;
    const dy = cy - parent.y;
    const centerDistance = Math.hypot(dx, dy);

    if (centerDistance < min(width, height) * 0.035) {
      growthFrontier = growthFrontier.filter(p => p !== parent);
      continue;
    }

    const inwardAngle = Math.atan2(dy, dx);
    const angle = inwardAngle + random(-1.15, 1.15);
    const step = parent.r * random(1.7, 2.8);

    const nx = parent.x + Math.cos(angle) * step;
    const ny = parent.y + Math.sin(angle) * step;

    if (nx < 0 || nx > width || ny < 0 || ny > height) continue;

    // Every offspring must be closer to the center than its parent.
    const newDistance = dist(nx, ny, cx, cy);
    if (newDistance >= centerDistance - 1) continue;

    let overlaps = false;
    for (const other of moldParticles) {
      if (dist(nx, ny, other.x, other.y) < (parent.r + other.r) * 1.15) {
        overlaps = true;
        break;
      }
    }

    if (overlaps) continue;

    const child = addMold(nx, ny, parent.r * random(0.82, 1.08));
    if (child) {
      parent.children++;
      parent.cooldown = random(200, 700);
      return;
    }
  }
}

function displayMold() {
  noStroke();

  for (const p of moldParticles) {
    fill(55, 145 + random(-8, 8), 65);
    circle(p.x, p.y, p.r * 2);

    fill(115, 190, 95, 100);
    circle(p.x - p.r * 0.2, p.y - p.r * 0.2, p.r * 0.75);
  }
}

// --------------------------------------------------
// HEARTS
// --------------------------------------------------

class HeartParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = random(-0.7, 0.7);
    this.vy = random(-1.8, -0.7);
    this.life = 70;
    this.size = random(12, 19);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.012;
    this.life--;
  }

  display() {
    push();
    translate(this.x, this.y);
    noStroke();
    fill(255, 100, 155, map(this.life, 0, 70, 0, 230));
    textAlign(CENTER, CENTER);
    textSize(this.size);
    text("♥", 0, 0);
    pop();
  }
}

function spawnHearts(x, y) {
  for (let i = 0; i < 5; i++) {
    heartParticles.push(new HeartParticle(x + random(-12, 12), y + random(-8, 8)));
  }
}

// --------------------------------------------------
// LIZARD
// --------------------------------------------------

class Lizard {
  constructor() {
    this.unit = min(width, height) / 400;
    this.bodyLength = 9;
    this.segmentSpacing = 8 * this.unit;
    this.headRadius = 8 * this.unit;

    this.x = width * 0.5;
    this.y = height * 0.5;

    // Start with a non-zero velocity in a random direction.
    const initialAngle = random(TWO_PI);
    this.vx = Math.cos(initialAngle);
    this.vy = Math.sin(initialAngle);

    this.heading = initialAngle;
    this.maxSpeed = 2.0 * this.unit;
    this.acceleration = 0.085 * this.unit;
    this.turnRate = 0.055;

    this.segments = [];
    for (let i = 0; i < this.bodyLength; i++) {
      this.segments.push({
        x: this.x - Math.cos(initialAngle) * this.segmentSpacing * (i + 1),
        y: this.y - Math.sin(initialAngle) * this.segmentSpacing * (i + 1)
      });
    }

    this.target = null;
    this.targetStarted = 0;
    this.abandoned = new WeakSet();

    this.waypoint = null;
    this.nextWaypointTime = 0;
    this.pickWaypoint();

    this.legPhase = 0;
  }

  // Choose a roaming destination using the actual window dimensions.
  pickWaypoint() {
    const marginX = width * 0.13;
    const marginY = height * 0.13;

    this.waypoint = {
      x: random(marginX, max(marginX + 1, width - marginX)),
      y: random(marginY, max(marginY + 1, height - marginY))
    };

    this.nextWaypointTime = millis() + random(3500, 6500);
  }

  selectTarget() {
    let best = null;
    let bestScore = Infinity;

    const cx = width / 2;
    const cy = height / 2;
    const screenSize = Math.hypot(width, height);

    // Green mold is the primary food.
    for (const p of moldParticles) {
      if (!p.alive || this.abandoned.has(p)) continue;

      const centerDist = dist(p.x, p.y, cx, cy) / screenSize;
      const travelDist = dist(this.x, this.y, p.x, p.y) / screenSize;

      // Center proximity matters much more than travel distance.
      const score = centerDist * 0.78 + travelDist * 0.22;

      if (score < bestScore) {
        bestScore = score;
        best = p;
      }
    }

    // Pink food remains edible, but mold takes priority.
    if (!best && pinkFood.length > 0) {
      for (const p of pinkFood) {
        const centerDist = dist(p.x, p.y, cx, cy) / screenSize;
        const travelDist = dist(this.x, this.y, p.x, p.y) / screenSize;
        const score = centerDist * 0.78 + travelDist * 0.22;

        if (score < bestScore) {
          bestScore = score;
          best = p;
        }
      }
    }

    if (best) {
      this.target = best;
      this.targetStarted = millis();
    }
  }

  validateTarget() {
    if (!this.target) return;

    const isMold = this.target instanceof MoldParticle;
    const stillExists = isMold
      ? this.target.alive && moldParticles.includes(this.target)
      : pinkFood.includes(this.target);

    if (!stillExists) {
      this.target = null;
      return;
    }

    // Do not retry a target that has proven unreachable.
    if (millis() - this.targetStarted > 5000) {
      if (isMold) this.abandoned.add(this.target);
      this.target = null;
    }
  }

  // Smooth acceleration toward a desired direction.
  steerToward(tx, ty, strength = 1) {
    let dx = tx - this.x;
    let dy = ty - this.y;
    const d = Math.hypot(dx, dy);

    if (d < 0.001) return;

    dx /= d;
    dy /= d;

    const desiredVx = dx * this.maxSpeed;
    const desiredVy = dy * this.maxSpeed;

    this.vx += (desiredVx - this.vx) * this.turnRate * strength;
    this.vy += (desiredVy - this.vy) * this.turnRate * strength;
  }

  avoidEdges() {
    // Smooth inward pressure increases as the lizard approaches an edge.
    const margin = min(width, height) * 0.12;
    let fx = 0;
    let fy = 0;

    if (this.x < margin) fx += (margin - this.x) / margin;
    if (this.x > width - margin) fx -= (this.x - (width - margin)) / margin;
    if (this.y < margin) fy += (margin - this.y) / margin;
    if (this.y > height - margin) fy -= (this.y - (height - margin)) / margin;

    const forceLength = Math.hypot(fx, fy);

    if (forceLength > 0.01) {
      fx /= forceLength;
      fy /= forceLength;

      // Blend edge avoidance with current movement.
      this.vx += fx * this.acceleration * 2.4;
      this.vy += fy * this.acceleration * 2.4;
    }
  }

  updateBody() {
    // Each segment follows the preceding point at a stable distance.
    let previous = { x: this.x, y: this.y };

    for (const segment of this.segments) {
      const dx = segment.x - previous.x;
      const dy = segment.y - previous.y;
      const d = Math.hypot(dx, dy);

      if (d > this.segmentSpacing) {
        const ratio = this.segmentSpacing / d;
        segment.x = previous.x + dx * ratio;
        segment.y = previous.y + dy * ratio;
      }

      previous = segment;
    }
  }

  eatFood() {
    const eatDistance = this.headRadius + 7 * this.unit;

    if (!this.target) return;

    if (dist(this.x, this.y, this.target.x, this.target.y) < eatDistance) {
      if (this.target instanceof MoldParticle) {
        const eaten = this.target;
        eaten.alive = false;
        moldParticles = moldParticles.filter(p => p !== eaten);
        growthFrontier = growthFrontier.filter(p => p !== eaten);
      } else {
        pinkFood = pinkFood.filter(p => p !== this.target);
      }

      this.target = null;
    }
  }

  update() {
    const now = millis();

    this.validateTarget();

    if (!this.target) this.selectTarget();

    // If chasing, move toward food. Otherwise, explore.
    if (this.target) {
      this.steerToward(this.target.x, this.target.y, 1.0);
    } else {
      if (!this.waypoint ||
          now > this.nextWaypointTime ||
          dist(this.x, this.y, this.waypoint.x, this.waypoint.y) < min(width, height) * 0.09) {
        this.pickWaypoint();
      }

      this.steerToward(this.waypoint.x, this.waypoint.y, 0.72);
    }

    this.avoidEdges();

    // Prevent velocity from becoming zero or unstable.
    let speed = Math.hypot(this.vx, this.vy);

    if (speed < this.maxSpeed * 0.25) {
      const a = this.heading + random(-0.25, 0.25);
      this.vx += Math.cos(a) * this.acceleration;
      this.vy += Math.sin(a) * this.acceleration;
      speed = Math.hypot(this.vx, this.vy);
    }

    // Clamp speed to a responsive, predictable range.
    const max = this.maxSpeed;
    if (speed > max) {
      this.vx = this.vx / speed * max;
      this.vy = this.vy / speed * max;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Hard safety boundary: reflect inward if numerical drift reaches an edge.
    const pad = this.headRadius * 1.5;
    if (this.x < pad) {
      this.x = pad;
      this.vx = Math.abs(this.vx) + this.acceleration;
    }
    if (this.x > width - pad) {
      this.x = width - pad;
      this.vx = -Math.abs(this.vx) - this.acceleration;
    }
    if (this.y < pad) {
      this.y = pad;
      this.vy = Math.abs(this.vy) + this.acceleration;
    }
    if (this.y > height - pad) {
      this.y = height - pad;
      this.vy = -Math.abs(this.vy) - this.acceleration;
    }

    this.heading = Math.atan2(this.vy, this.vx);
    this.legPhase += speed * 0.12;

    this.updateBody();
    this.eatFood();
  }

  display() {
    push();

    // Tail to neck/body.
    noStroke();

    for (let i = this.segments.length - 1; i >= 0; i--) {
      const s = this.segments[i];
      const taper = map(i, 0, this.segments.length - 1, 0.82, 0.28);
      const radius = this.headRadius * taper;

      fill(220, 130, 75);
      ellipse(s.x, s.y, radius * 2.0, radius * 1.65);
    }

    // Draw legs attached to the body.
    this.drawLegPair(this.segments[1], 1);
    this.drawLegPair(this.segments[5], -1);

    // Head.
    translate(this.x, this.y);
    rotate(this.heading);

    fill(230, 145, 85);
    ellipse(0, 0, this.headRadius * 2.5, this.headRadius * 1.9);

    // Snout.
    fill(238, 160, 100);
    ellipse(this.headRadius * 0.85, 0, this.headRadius * 1.1, this.headRadius * 0.9);

    // Eyes.
    fill(35, 35, 30);
    circle(this.headRadius * 0.25, -this.headRadius * 0.48, this.headRadius * 0.3);
    circle(this.headRadius * 0.25, this.headRadius * 0.48, this.headRadius * 0.3);

    fill(255);
    circle(this.headRadius * 0.29, -this.headRadius * 0.5, this.headRadius * 0.11);
    circle(this.headRadius * 0.29, this.headRadius * 0.46, this.headRadius * 0.11);

    pop();
  }

  drawLegPair(segment, side) {
    if (!segment) return;

    const dx = this.x - segment.x;
    const dy = this.y - segment.y;
    const angle = Math.atan2(dy, dx);

    const offsetX = Math.cos(angle + Math.PI / 2) * this.headRadius * 0.65;
    const offsetY = Math.sin(angle + Math.PI / 2) * this.headRadius * 0.65;

    const swing = Math.sin(this.legPhase + side) * this.headRadius * 0.5;

    stroke(205, 120, 70);
    strokeWeight(max(1.5, this.unit * 2.2));
    strokeCap(ROUND);

    line(
      segment.x + offsetX,
      segment.y + offsetY,
      segment.x + offsetX + Math.cos(angle + side * 0.9) * this.headRadius + swing,
      segment.y + offsetY + Math.sin(angle + side * 0.9) * this.headRadius
    );

    line(
      segment.x - offsetX,
      segment.y - offsetY,
      segment.x - offsetX + Math.cos(angle - side * 0.9) * this.headRadius - swing,
      segment.y - offsetY + Math.sin(angle - side * 0.9) * this.headRadius
    );
  }

  containsPoint(px, py) {
    return dist(px, py, this.x, this.y) < this.headRadius * 2.2;
  }
}

// --------------------------------------------------
// INTERACTION
// --------------------------------------------------

function handleInteraction(x, y) {
  if (lizard && lizard.containsPoint(x, y)) {
    spawnHearts(x, y);
  } else {
    pinkFood.push({
      x: x,
      y: y,
      r: max(4, min(width, height) * 0.012)
    });
  }
}

function mousePressed() {
  handleInteraction(mouseX, mouseY);
  return false;
}

function touchStarted() {
  if (touches.length > 0) {
    handleInteraction(touches[0].x, touches[0].y);
  }
  return false;
}

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

function windowResized() {
  const oldW = width;
  const oldH = height;

  resizeCanvas(windowWidth, windowHeight);

  const sx = width / oldW;
  const sy = height / oldH;

  // Preserve the existing terrarium when orientation changes.
  for (const p of moldParticles) {
    p.x *= sx;
    p.y *= sy;
  }

  for (const p of pinkFood) {
    p.x *= sx;
    p.y *= sy;
  }

  for (const h of heartParticles) {
    h.x *= sx;
    h.y *= sy;
  }

  if (lizard) {
    lizard.x *= sx;
    lizard.y *= sy;

    for (const s of lizard.segments) {
      s.x *= sx;
      s.y *= sy;
    }

    if (lizard.waypoint) {
      lizard.waypoint.x *= sx;
      lizard.waypoint.y *= sy;
    }

    // Recalculate movement scale for the new screen dimensions.
    lizard.unit = min(width, height) / 400;
    lizard.headRadius = 8 * lizard.unit;
    lizard.segmentSpacing = 8 * lizard.unit;
    lizard.maxSpeed = 2.0 * lizard.unit;
    lizard.acceleration = 0.085 * lizard.unit;
  }
}
</script>
</body>
</html>
