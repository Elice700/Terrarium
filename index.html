<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Terrarium</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    let moldParticles = [];
    let pinkFood = [];
    let heartParticles = [];
    let lizard;

    // Mold (Physarum-inspired agent behavior) parameters
    const SENSOR_ANGLE = 45; // Degrees
    const SENSOR_DIST = 15;
    const STEP_SIZE = 1.2;
    const TRAIL_SCALE = 4;
    let trailMap = [];
    let trailCols, trailRows;

    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      angleMode(DEGREES);

      trailCols = floor(width / TRAIL_SCALE);
      trailRows = floor(height / TRAIL_SCALE);
      initTrailMap();

      // Instantiate Lizard in the center
      lizard = new Lizard(width / 2, height / 2);

      // Initial batch of mold particles around edges
      for (let i = 0; i < 150; i++) {
        spawnMoldAtEdge();
      }
    }

    function initTrailMap() {
      trailMap = new Float32Array(trailCols * trailRows);
    }

    function draw() {
      // 1. Draw Layer 1: Light Grey Background with a clean terrarium glass circle
      background(235, 235, 235);
      
      // Terrarium glass container base effect
      push();
      noStroke();
      fill(250, 250, 250, 200);
      ellipse(width / 2, height / 2, min(width, height) * 0.88);
      noFill();
      stroke(200, 205, 200);
      strokeWeight(4);
      ellipse(width / 2, height / 2, min(width, height) * 0.88);
      pop();

      // Continuous slow spawn of mold particles on edges
      if (frameCount % 3 === 0 && moldParticles.length < 500) {
        spawnMoldAtEdge();
      }

      // Evaporate trail map
      for (let i = 0; i < trailMap.length; i++) {
        trailMap[i] *= 0.95;
      }

      // 2. Update & Draw Layer 2: Mold Growth
      noStroke();
      fill(100, 190, 80, 200);
      for (let i = moldParticles.length - 1; i >= 0; i--) {
        let p = moldParticles[i];
        p.update();
        p.display();

        let tx = floor(p.x / TRAIL_SCALE);
        let ty = floor(p.y / TRAIL_SCALE);
        if (tx >= 0 && tx < trailCols && ty >= 0 && ty < trailRows) {
          trailMap[tx + ty * trailCols] = min(1.0, trailMap[tx + ty * trailCols] + 0.3);
        }
      }

      // Draw Pink Dot Snacks spawned by user clicking mold
      for (let i = pinkFood.length - 1; i >= 0; i--) {
        let f = pinkFood[i];
        fill(255, 105, 180);
        stroke(255, 192, 203);
        strokeWeight(1.5);
        circle(f.x, f.y, 10 + sin(frameCount * 10 + i) * 2);
      }

      // 3. Update & Draw Layer 3: Lizard
      lizard.update();
      lizard.display();

      // 4. Update & Draw Layer 4: Floating Hearts & Interactive FX
      for (let i = heartParticles.length - 1; i >= 0; i--) {
        let hp = heartParticles[i];
        hp.update();
        hp.display();
        if (hp.isDead()) {
          heartParticles.splice(i, 1);
        }
      }
    }

    function spawnMoldAtEdge() {
      let x, y, angle;
      let side = floor(random(4));
      if (side === 0) { x = random(width); y = 0; }
      else if (side === 1) { x = width; y = random(height); }
      else if (side === 2) { x = random(width); y = height; }
      else { x = 0; y = random(height); }
      
      let centerAngle = atan2(height / 2 - y, width / 2 - x);
      angle = centerAngle + random(-30, 30);
      moldParticles.push(new MoldParticle(x, y, angle));
    }

    class MoldParticle {
      constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.angle = angle;
      }

      update() {
        let centerHeading = atan2(height / 2 - this.y, width / 2 - this.x);
        
        let fwdX = this.x + cos(this.angle) * SENSOR_DIST;
        let fwdY = this.y + sin(this.angle) * SENSOR_DIST;
        let leftX = this.x + cos(this.angle - SENSOR_ANGLE) * SENSOR_DIST;
        let leftY = this.y + sin(this.angle - SENSOR_ANGLE) * SENSOR_DIST;
        let rightX = this.x + cos(this.angle + SENSOR_ANGLE) * SENSOR_DIST;
        let rightY = this.y + sin(this.angle + SENSOR_ANGLE) * SENSOR_DIST;

        let fwdVal = getTrailValue(fwdX, fwdY);
        let leftVal = getTrailValue(leftX, leftY);
        let rightVal = getTrailValue(rightX, rightY);

        if (fwdVal > leftVal && fwdVal > rightVal) {
          // Keep straight
        } else if (leftVal > rightVal) {
          this.angle -= 12;
        } else if (rightVal > leftVal) {
          this.angle += 12;
        } else {
          this.angle += (centerHeading - this.angle) * 0.05 + random(-8, 8);
        }

        this.x += cos(this.angle) * STEP_SIZE;
        this.y += sin(this.angle) * STEP_SIZE;

        this.x = constrain(this.x, 2, width - 2);
        this.y = constrain(this.y, 2, height - 2);
      }

      display() {
        circle(this.x, this.y, 4);
      }
    }

    function getTrailValue(x, y) {
      let tx = floor(x / TRAIL_SCALE);
      let ty = floor(y / TRAIL_SCALE);
      if (tx >= 0 && tx < trailCols && ty >= 0 && ty < trailRows) {
        return trailMap[tx + ty * trailCols];
      }
      return 0;
    }

    class Lizard {
      constructor(x, y) {
        this.numSegments = 16;
        this.segmentLen = 14;
        this.history = [];
        this.headAngle = 0;
        this.speed = 2.2;

        for (let i = 0; i < this.numSegments; i++) {
          this.history.push(createVector(x - i * this.segmentLen, y));
        }
      }

      update() {
        let head = this.history[0].copy();
        let target = null;
        let minDist = Infinity;

        for (let f of pinkFood) {
          let d = dist(head.x, head.y, f.x, f.y);
          if (d < minDist) {
            minDist = d;
            target = createVector(f.x, f.y);
          }
        }

        if (!target) {
          let center = createVector(width / 2, height / 2);
          for (let p of moldParticles) {
            let distFromCenter = dist(p.x, p.y, center.x, center.y);
            let distFromHead = dist(p.x, p.y, head.x, head.y);
            if (distFromCenter < max(width, height) * 0.45 && distFromHead < minDist) {
              minDist = distFromHead;
              target = createVector(p.x, p.y);
            }
          }
        }

        if (!target) {
          let wanderX = width / 2 + cos(frameCount * 1.5) * (width * 0.25);
          let wanderY = height / 2 + sin(frameCount * 1.1) * (height * 0.25);
          target = createVector(wanderX, wanderY);
        }

        let desiredAngle = atan2(target.y - head.y, target.x - head.x);
        let angleDiff = (desiredAngle - this.headAngle + 540) % 360 - 180;
        this.headAngle += constrain(angleDiff, -6, 6);

        let nextHead = createVector(
          head.x + cos(this.headAngle) * this.speed,
          head.y + sin(this.headAngle) * this.speed
        );

        for (let i = 4; i < this.history.length; i++) {
          if (p5.Vector.dist(nextHead, this.history[i]) < this.segmentLen * 0.8) {
            this.headAngle += 45;
            nextHead = createVector(
              head.x + cos(this.headAngle) * this.speed,
              head.y + sin(this.headAngle) * this.speed
            );
            break;
          }
        }

        let distFromCenter = dist(nextHead.x, nextHead.y, width / 2, height / 2);
        let maxRadius = min(width, height) * 0.42;
        if (distFromCenter > maxRadius) {
          let angleToCenter = atan2(height / 2 - nextHead.y, width / 2 - nextHead.x);
          this.headAngle = angleToCenter;
        }

        this.history[0] = nextHead;
        for (let i = 1; i < this.history.length; i++) {
          let prev = this.history[i - 1];
          let curr = this.history[i];
          let dir = p5.Vector.sub(prev, curr);
          dir.setMag(this.segmentLen);
          this.history[i] = p5.Vector.sub(prev, dir);
        }

        for (let i = pinkFood.length - 1; i >= 0; i--) {
          if (dist(nextHead.x, nextHead.y, pinkFood[i].x, pinkFood[i].y) < 18) {
            pinkFood.splice(i, 1);
            spawnHearts(nextHead.x, nextHead.y, 4);
          }
        }

        for (let i = moldParticles.length - 1; i >= 0; i--) {
          if (dist(nextHead.x, nextHead.y, moldParticles[i].x, moldParticles[i].y) < 16) {
            moldParticles.splice(i, 1);
          }
        }
      }

      display() {
        noStroke();
        this.drawLegPair(3, 24, 40);
        this.drawLegPair(10, 20, 50);

        for (let i = this.history.length - 1; i >= 0; i--) {
          let pos = this.history[i];
          let size = map(i, 0, this.history.length - 1, 22, 6);
          fill(50 + i * 2, 160 - i * 3, 90);
          stroke(25, 80, 45);
          strokeWeight(2);
          circle(pos.x, pos.y, size);
        }

        let head = this.history[0];
        push();
        translate(head.x, head.y);
        rotate(this.headAngle);
        fill(60, 180, 100);
        stroke(25, 80, 45);
        strokeWeight(2);
        ellipse(2, 0, 26, 20);

        fill(255, 215, 0);
        noStroke();
        ellipse(6, -6, 6, 6);
        ellipse(6, 6, 6, 6);
        fill(0);
        ellipse(7, -6, 2, 4);
        ellipse(7, 6, 2, 4);
        pop();
      }

      drawLegPair(segmentIdx, legLen, restAngle) {
        if (segmentIdx >= this.history.length) return;
        let pos = this.history[segmentIdx];
        let prev = this.history[segmentIdx - 1];
        let angle = atan2(pos.y - prev.y, pos.x - prev.x);

        stroke(40, 120, 60);
        strokeWeight(4);
        strokeCap(ROUND);

        let wiggle = sin(frameCount * 15 + segmentIdx * 10) * 15;

        push();
        translate(pos.x, pos.y);
        rotate(angle - restAngle + wiggle);
        line(0, 0, 0, -legLen);
        pop();

        push();
        translate(pos.x, pos.y);
        rotate(angle + restAngle - wiggle);
        line(0, 0, 0, legLen);
        pop();
      }

      containsPoint(px, py) {
        for (let i = 0; i < 6; i++) {
          if (dist(px, py, this.history[i].x, this.history[i].y) < 22) {
            return true;
          }
        }
        return false;
      }
    }

    class HeartParticle {
      constructor(x, y) {
        this.x = x + random(-10, 10);
        this.y = y + random(-10, 10);
        this.vy = random(-2, -0.8);
        this.vx = random(-0.5, 0.5);
        this.alpha = 255;
        this.size = random(16, 24);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 4;
      }

      display() {
        push();
        translate(this.x, this.y);
        textSize(this.size);
        textAlign(CENTER, CENTER);
        fill(220, 50, 90, this.alpha);
        text('❤️', 0, 0);
        pop();
      }

      isDead() {
        return this.alpha <= 0;
      }
    }

    function spawnHearts(x, y, count = 3) {
      for (let i = 0; i < count; i++) {
        heartParticles.push(new HeartParticle(x, y));
      }
    }

    function mousePressed() {
      handleInteraction(mouseX, mouseY);
    }

    function touchStarted() {
      if (touches.length > 0) {
        handleInteraction(touches[0].x, touches[0].y);
      }
      return false;
    }

    function handleInteraction(ix, iy) {
      if (lizard.containsPoint(ix, iy)) {
        spawnHearts(lizard.history[0].x, lizard.history[0].y, 5);
        return;
      }

      let tappedMold = false;
      for (let i = moldParticles.length - 1; i >= 0; i--) {
        let p = moldParticles[i];
        if (dist(ix, iy, p.x, p.y) < 25) {
          moldParticles.splice(i, 1);
          tappedMold = true;
        }
      }

      if (tappedMold) {
        pinkFood.push(createVector(ix, iy));
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      trailCols = floor(width / TRAIL_SCALE);
      trailRows = floor(height / TRAIL_SCALE);
      initTrailMap();
    }
  </script>
</body>
</html>
